name: Release

# push a tag like v1.2.0 and this builds Windows + macOS and attaches
# everything to the GitHub release for that tag
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run dist
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            dist/BeanyIK-Setup-*.exe
            dist/BeanyIK-Setup-*.exe.blockmap
            dist/BeanyIK-Portable-*.exe
            dist/latest.yml

  mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run dist:mac
        env:
          # no Apple developer certificate, build unsigned
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            dist/BeanyIK-*-mac-*.dmg
            dist/BeanyIK-*-mac-*.zip
            dist/latest-mac.yml
