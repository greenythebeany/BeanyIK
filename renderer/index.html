<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>BeanyIK</title>
<meta http-equiv="Content-Security-Policy" content="default-src 'self' app:; script-src 'self' app: 'unsafe-inline' 'unsafe-eval'; style-src 'self' app: 'unsafe-inline'; img-src 'self' app: data: blob:">
<script>
(function () {
  try {
    var theme = localStorage.getItem('beanyik_theme') || 'light';
    if (theme === 'system') theme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
    document.documentElement.dataset.theme = theme;
  } catch (e) { document.documentElement.dataset.theme = 'light'; }
  if (/Mac/.test(navigator.platform)) document.documentElement.classList.add('mac');
})();
</script>
<script type="importmap">
{ "imports": { "three": "./vendor/three/three.module.js", "three/addons/": "./vendor/three/" } }
</script>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="appbar">
    <div class="appbar-left">
      <img class="app-logo" src="logo.png" alt="BeanyIK" title="BeanyIK" draggable="false">
      <button class="appbar-btn" id="btn-menu"><span class="ico" data-icon="menu"></span><span data-i18n="Menu">Menu</span></button>
      <div class="tabs" id="tabs"></div>
    </div>
    <div class="appbar-right">
      <button class="icon-btn" id="btn-undo" data-i18n-title="Undo (Ctrl+Z)"><span class="ico" data-icon="undo"></span></button>
      <button class="icon-btn" id="btn-redo" data-i18n-title="Redo (Ctrl+Y)"><span class="ico" data-icon="redo"></span></button>
      <button class="lang-btn" id="btn-lang" title="Language / Jazyk"><span class="ico" data-icon="globe"></span><span id="lang-label">EN</span></button>
      <button class="icon-btn" id="btn-theme" data-i18n-title="Toggle theme"><span class="ico" data-icon="theme"></span></button>
      <button class="btn btn-primary" id="btn-save"><span class="ico" data-icon="save"></span><span data-i18n="Save">Save</span></button>
      <div class="win-buttons">
        <button class="win-btn" id="btn-min" data-i18n-title="Minimize"><span class="ico" data-icon="winMin"></span></button>
        <button class="win-btn" id="btn-max" data-i18n-title="Maximize"><span class="ico" data-icon="winMax"></span></button>
        <button class="win-btn win-close" id="btn-close" data-i18n-title="Close"><span class="ico" data-icon="winClose"></span></button>
      </div>
    </div>
  </header>

  <div class="menu-popover" id="menu" hidden></div>

  <!-- Home (start screen) -->
  <section class="home" id="home"></section>

  <!-- Document workspace -->
  <section class="workspace" id="workspace" hidden>
    <aside class="tools-panel" id="tools-panel"></aside>

    <main class="canvas-area" id="canvas-area">
      <div class="quick-rail" id="quick-rail"></div>
      <div class="viewport-card" id="viewport-card">
        <div class="viewport" id="viewport"></div>
        <div class="drop-hint" id="drop-hint"><span class="ico" data-icon="plus"></span><span data-i18n="Drop to add to the end of the chain"></span></div>
        <div class="fig-caption" id="fig-caption"></div>
        <div class="demo-chip" id="demo-chip" hidden></div>
        <div class="hud" id="hud"></div>
      </div>
      <div class="float-pill" id="view-pill"></div>
    </main>

    <aside class="side-panel" id="side-panel">
      <div class="side-head"><h2 id="side-title"></h2><button class="icon-btn small" id="side-close" data-i18n-title="Hide panel"><span class="ico" data-icon="close"></span></button></div>
      <div class="side-body" id="side-body"></div>
    </aside>
    <nav class="right-rail" id="right-rail"></nav>
  </section>

  <div class="modal" id="shortcuts" hidden></div>
  <div class="modal" id="about" hidden></div>
  <div class="modal" id="confirm" hidden></div>
  <div class="modal" id="update" hidden></div>
  <div class="toast-host" id="toasts"></div>

  <script src="web.js"></script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
